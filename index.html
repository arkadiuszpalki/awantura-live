<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex">
  <title>Awantura o kasę · na żywo</title>
  <link rel="preload" href="fonts/led-dot-matrix.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=20261004131006">
</head>
<body>
  <main id="view" class="screen plain pad"></main>
  <div class="conn" id="conn" hidden></div>

  <!-- Portrait: the player page works only in landscape. -->
  <div class="turn" id="turn" role="alert">
    <div class="turn-art" aria-hidden="true">
      <div class="phone"><div class="screen-art"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div><span class="island"></span></div>
      <div class="arrow">↺</div>
    </div>
    <div class="led title">OBRÓĆ TELEFON</div>
    <p class="sub">Podgląd gry działa w poziomie.</p>
    <p class="hint">Jeśli ekran się nie obraca: wyłącz blokadę orientacji w Centrum sterowania.</p>
  </div>
  <div class="dbg" id="dbg" hidden></div>

  <div class="nocode" id="nocode" hidden>
    <div class="box led big">AWANTURA O KASĘ</div>
    <p>Zeskanuj kod QR z telefonu prowadzącego<br>albo wpisz kod gry:</p>
    <form id="codeForm"><input id="codeInput" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC234"><button class="btn primary led">OGLĄDAJ</button></form>
  </div>

  <script src="app.js?v=20261004131006"></script>
</body>
</html>
